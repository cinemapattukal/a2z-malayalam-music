<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A2Z Malayalam Songs — Admin</title>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fa;color:#151515}
button,input{font:inherit}.hidden{display:none!important}.wrap{max-width:1050px;margin:auto;padding:20px}
.card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 4px 18px rgba(0,0,0,.07)}
.login{max-width:430px;margin:55px auto}h1,h2{margin-top:0}
label{display:block;font-size:14px;font-weight:700;margin:14px 0 6px}
input{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;outline:0;background:#fff}
input:focus{border-color:#168cff}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}
.primary,.action{border:0;border-radius:10px;padding:13px 18px;background:#168cff;color:#fff;font-weight:700;cursor:pointer}
.primary{width:100%;margin-top:18px}.logout,.cancel{border:0;border-radius:10px;padding:11px 15px;background:#eee;color:#222;cursor:pointer}
.error{color:#d33;font-size:13px;margin-top:12px}.success{color:#168a45;font-size:13px;margin-top:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.stat{background:#fff;border-radius:15px;padding:20px}
.stat b{font-size:30px;display:block;margin-top:8px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.form{margin-top:20px}.formTitle{display:flex;justify-content:space-between;align-items:center;gap:10px}
@media(max-width:650px){.grid{grid-template-columns:1fr}.wrap{padding:15px}.login{margin:25px auto}}
</style>
</head>
<body>

<section id="loginPage" class="wrap">
<div class="card login">
<h1>🔐 Admin Login</h1><p style="color:#777">A2Z Malayalam Songs</p>
<label>Email</label><input id="email" type="email" autocomplete="username" placeholder="Admin email">
<label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Password">
<button id="loginBtn" class="primary" type="button">Login</button>
<div id="loginError" class="error"></div>
</div>
</section>

<section id="adminPage" class="wrap hidden">
<div class="top"><div><h1>🎵 Admin Dashboard</h1><div id="adminEmail" style="color:#777"></div></div><button id="logoutBtn" class="logout" type="button">Logout</button></div>

<div class="grid">
<div class="stat">Albums<b id="albumCount">0</b></div>
<div class="stat">Songs<b id="songCount">0</b></div>
<div class="stat">Singers<b id="singerCount">0</b></div>
</div>

<div class="card" style="margin-top:20px">
<h2>Admin Panel</h2>
<div class="actions">
<button id="addAlbumBtn" class="action" type="button">＋ Add Album</button>
<button id="addSongBtn" class="action" type="button">＋ Add Song</button>
<button id="addSingerBtn" class="action" type="button">＋ Add Singer</button>
</div>
<p id="message" style="color:#777;margin-top:18px">Choose an option above.</p>
</div>

<div id="albumFormCard" class="card form hidden">
<div class="formTitle"><h2>＋ Add Album</h2><button id="cancelAlbumBtn" class="cancel" type="button">Cancel</button></div>
<label>Album Name</label><input id="albumName" type="text" placeholder="Malayalam Hits">
<label>Year</label><input id="albumYear" type="number" min="1900" max="2100" placeholder="2026">
<label>Album Image URL</label><input id="albumImage" type="url" placeholder="https://...">
<label>Total Tracks</label><input id="albumTracks" type="number" min="0" placeholder="10">
<label>Director</label><input id="albumDirector" type="text" placeholder="Director name">
<label>Starring</label><input id="albumStarring" type="text" placeholder="Starring">
<label>Released</label><input id="albumReleased" type="date">
<div class="actions"><button id="saveAlbumBtn" class="action" type="button">Save Album</button></div>
<div id="albumError" class="error"></div><div id="albumSuccess" class="success"></div>
</div>
</section>

<script>
const firebaseConfig={
apiKey:"AIzaSyA9rRMUOfcksZjZj04RQLkKrXsKzXKHmRI",
authDomain:"malayalamsongs-5916d.firebaseapp.com",
projectId:"malayalamsongs-5916d",
storageBucket:"malayalamsongs-5916d.firebasestorage.app",
messagingSenderId:"44232575519",
appId:"1:44232575519:web:ceaf71571d2d693a7d232a",
measurementId:"G-LHZR62BRNH"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(), db=firebase.firestore();

const $=id=>document.getElementById(id);

function openAlbumForm(){
 $("albumFormCard").classList.remove("hidden");
 $("albumError").textContent="";
 $("albumSuccess").textContent="";
 $("message").textContent="Add album details below.";
 $("albumName").focus();
 window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
}
function closeAlbumForm(){
 $("albumFormCard").classList.add("hidden");
}
function showNotReady(name){
 $("message").textContent=name+" section will be added next.";
}
async function login(){
 $("loginError").textContent="";
 try{await auth.signInWithEmailAndPassword($("email").value.trim(),$("password").value);}
 catch(e){$("loginError").textContent=e.message;}
}
async function saveAlbum(){
 const err=$("albumError"), ok=$("albumSuccess"), btn=$("saveAlbumBtn");
 err.textContent="";ok.textContent="";
 const name=$("albumName").value.trim(),year=$("albumYear").value.trim(),imageUrl=$("albumImage").value.trim();
 if(!name)return err.textContent="Album Name is required.";
 if(!year)return err.textContent="Year is required.";
 if(!imageUrl)return err.textContent="Album Image URL is required.";
 btn.disabled=true;btn.textContent="Saving...";
 try{
  await db.collection("albums").add({
   name,year:Number(year),imageUrl,
   totalTracks:Number($("albumTracks").value||0),
   director:$("albumDirector").value.trim(),
   starring:$("albumStarring").value.trim(),
   released:$("albumReleased").value||"",
   createdAt:firebase.firestore.FieldValue.serverTimestamp()
  });
  ok.textContent="Album saved successfully.";
  $("message").textContent="Album added: "+name;
  ["albumName","albumYear","albumImage","albumTracks","albumDirector","albumStarring","albumReleased"].forEach(id=>$(id).value="");
  await loadCounts();
 }catch(e){err.textContent="Could not save album: "+e.message;}
 finally{btn.disabled=false;btn.textContent="Save Album";}
}
async function loadCounts(){
 try{
  const a=await db.collection("albums").get();$("albumCount").textContent=a.size;
  let songs=0,singers=new Set();
  await Promise.all(a.docs.map(async d=>{
   const s=await db.collection("albums").doc(d.id).collection("songs").get();
   songs+=s.size;s.forEach(x=>{const v=x.data().singer;if(v)singers.add(String(v));});
  }));
  $("songCount").textContent=songs;$("singerCount").textContent=singers.size;
 }catch(e){console.log(e);}
}

$("loginBtn").addEventListener("click",login);
$("logoutBtn").addEventListener("click",()=>auth.signOut());
$("addAlbumBtn").addEventListener("click",openAlbumForm);
$("cancelAlbumBtn").addEventListener("click",closeAlbumForm);
$("saveAlbumBtn").addEventListener("click",saveAlbum);
$("addSongBtn").addEventListener("click",()=>showNotReady("Add Song"));
$("addSingerBtn").addEventListener("click",()=>showNotReady("Add Singer"));

auth.onAuthStateChanged(user=>{
 if(user){
  $("loginPage").classList.add("hidden");$("adminPage").classList.remove("hidden");
  $("adminEmail").textContent=user.email||"";loadCounts();
 }else{
  $("adminPage").classList.add("hidden");$("loginPage").classList.remove("hidden");
 }
});
</script>
</body>
</html>
