<script>
const tg = window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();}

let albums = [];
let singers = [];
let songs = [];

async function loadFirebaseData(){
  try{
    const albumSnap = await db.collection("albums").get();

    albums = albumSnap.docs.map(doc => {
      const d = doc.data();
      return {
        id: doc.id,
        name: d.name || "",
        year: String(d.year || ""),
        count: Number(d.songCount ?? d.count ?? d.totalTracks ?? 0),
        img: d.imageUrl || d.image || d.img || d.cover || d.poster || ""
      };
    });

    const songPromises = albumSnap.docs.map(async albumDoc => {
      const snap = await db.collection("albums").doc(albumDoc.id).collection("songs").get();
      return snap.docs.map(doc => {
        const d = doc.data();
        return {
          id: doc.id,
          name: d.name || "",
          singer: d.singer || "",
          year: String(d.released ?? d.year ?? ""),
          album: albumDoc.id,
          img: d.imageUrl || d.image || d.img || d.cover || d.poster || "",
          audio: d.audioUrl || d.audio || "",
          youtube: d.youtubeUrl || d.youtube || "",
          duration: d.duration || "",
          lyrics: d.lyrics || "",
          music: d.music || ""
        };
      });
    });

    const nestedSongs = await Promise.all(songPromises);
    songs = nestedSongs.flat();

    const singerMap = new Map();
    songs.forEach(s => {
      if(s.singer && !singerMap.has(s.singer)){
        singerMap.set(s.singer, {
          name: s.singer,
          img: s.img || "https://picsum.photos/200/200?random=21"
        });
      }
    });
    singers = [...singerMap.values()];

    renderHome();
  }catch(err){
    console.error("Firebase load error:", err);
    document.getElementById("albums").innerHTML = `<div class="empty">Firebase data load failed.<br><small>${String(err.message || err)}</small></div>`;
    document.getElementById("songs").innerHTML = "";
    document.getElementById("singers").innerHTML = "";
  }
}

let currentSong=null;
let albumSongIndex=0;
let currentAlbumId=null;
let ytPlayer=null;
let ytReady=false;
let ytTimer=null;

const favs=()=>JSON.parse(localStorage.getItem("a2zFavorites")||"[]");
function saveFavs(a){localStorage.setItem("a2zFavorites",JSON.stringify(a));}

function safeImageUrl(url, fallback="https://via.placeholder.com/500x500?text=A2Z+Malayalam+Songs") {
  const v=String(url||"").trim();
  return v || fallback;
}

function imageTag(url, alt="", className=""){
  const src=safeImageUrl(url);
  const esc=String(src).replace(/&/g,"&amp;").replace(/"/g,"&quot;");
  return `<img class="${className}" src="${esc}" alt="${String(alt).replace(/"/g,"&quot;")}" loading="lazy" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src='https://via.placeholder.com/500x500?text=Image+Unavailable';">`;
}

function renderHome(){
 document.getElementById("albums").innerHTML=albums.map(a=>`
 <button class="album" onclick="openAlbum(\'${a.id.replaceAll("\'","\\\'")}\')">
 ${imageTag(a.img,a.name)}<div class="album-info"><div class="album-name">${a.name}</div>
 <div class="muted">${a.year} • ${a.count} Songs</div></div></button>`).join("");

 document.getElementById("songs").innerHTML=songs.map(songHTML).join("");

 document.getElementById("singers").innerHTML=singers.map(s=>`
 <button class="singer" onclick="searchSinger('${s.name.replaceAll("'","\\'")}')">
 ${imageTag(s.img,s.name)}<div>${s.name}</div></button>`).join("");
}

function jsArg(value){
 return JSON.stringify(String(value)).replace(/</g,"\u003c").replace(/>/g,"\u003e").replace(/&/g,"\u0026");
}

function songHTML(s){
 const isFav=favs().map(String).includes(String(s.id));
 const idArg=jsArg(s.id);
 return `<div class="song" data-song-id="${String(s.id).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}" role="button" tabindex="0">
 ${imageTag(s.img,s.name)}
 <div class="song-info">
 <div class="song-name">${s.name}</div><div class="muted">${s.singer} • ${s.year}</div></div>
 <button type="button" class="heart" data-action="favorite" data-song-id="${String(s.id).replace(/"/g,"&quot;")}">${isFav?'❤️':'♡'}</button>
 <button type="button" class="play" data-action="play" data-song-id="${String(s.id).replace(/"/g,"&quot;")}">▶</button></div>`;
}

// Reliable song tap handler. Uses event delegation so it works for songs
// rendered later from Firebase (Home, Album, Search and Favorites).
document.addEventListener('click', function(e){
 const actionEl = e.target.closest('[data-action]');
 if(actionEl){
   const id = actionEl.getAttribute('data-song-id');
   if(actionEl.getAttribute('data-action') === 'favorite'){
     e.preventDefault(); e.stopPropagation(); toggleFavorite(id);
   }else if(actionEl.getAttribute('data-action') === 'play'){
     e.preventDefault(); e.stopPropagation(); openPlayer(id);
   }
   return;
 }
 const songEl = e.target.closest('.song[data-song-id]');
 if(songEl){
   e.preventDefault();
   openPlayer(songEl.getAttribute('data-song-id'));
 }
});

document.addEventListener('keydown', function(e){
 if(e.key !== 'Enter' && e.key !== ' ') return;
 const songEl = e.target.closest('.song[data-song-id]');
 if(songEl){ e.preventDefault(); openPlayer(songEl.getAttribute('data-song-id')); }
});

function hideAll(){
 ["home","searchPage","favoritesPage","profilePage","albumPage","playerPage"].forEach(id=>document.getElementById(id).classList.add("hidden"));
}
function goHome(){hideAll();document.getElementById("home").classList.remove("hidden");window.scrollTo(0,0);}
function openSearch(){hideAll();document.getElementById("searchPage").classList.remove("hidden");document.getElementById("searchInput").focus();searchAll();}
function showFavorites(){
 hideAll();document.getElementById("favoritesPage").classList.remove("hidden");
 const fs=songs.filter(s=>favs().map(String).includes(String(s.id)));
 document.getElementById("favorites").innerHTML=fs.length?fs.map(songHTML).join(""):`<div class="empty">❤️ No favorite songs yet.</div>`;
}
function showProfile(){
 hideAll();document.getElementById("profilePage").classList.remove("hidden");
 const u=tg?.initDataUnsafe?.user;
 document.getElementById("userName").textContent=u?((u.first_name||"")+" "+(u.last_name||"")).trim():"Telegram User";
 document.getElementById("userUsername").textContent=u?.username?"@"+u.username:"";
}
function openAlbum(id){
 const a=albums.find(x=>String(x.id)===String(id)); if(!a)return;
 currentAlbumId=a.id;
 hideAll();document.getElementById("albumPage").classList.remove("hidden");
 document.getElementById("albumCover").src=safeImageUrl(a.img);
  document.getElementById("albumCover").onerror=function(){this.onerror=null;this.src="https://via.placeholder.com/500x500?text=Image+Unavailable";};
 document.getElementById("albumTitle").textContent=a.name;
 document.getElementById("albumMeta").textContent=a.year+" • "+a.count+" Songs";
 const list=songs.filter(s=>String(s.album)===String(id));
 document.getElementById("albumSongs").innerHTML=list.length?list.map(songHTML).join(""):`<div class="empty">No songs added yet.</div>`;
 window.scrollTo(0,0);
}
function playAlbum(){
 const list=songs.filter(s=>String(s.album)===String(currentAlbumId));
 if(list.length)openPlayer(list[0].id);
}
function formatTime(seconds){
 if(!Number.isFinite(seconds) || seconds < 0) return "0:00";
 const total=Math.floor(seconds);
 const h=Math.floor(total/3600);
 const m=Math.floor((total%3600)/60);
 const sec=total%60;
 return h>0 ? `${h}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}` : `${m}:${String(sec).padStart(2,"0")}`;
}

function initYouTubePlayer(){
 if(ytPlayer || !window.YT || !YT.Player) return;
 ytReady=true;
 try{
  ytPlayer=new YT.Player('youtubePlayer',{
   width:'1',height:'1',videoId:'',
   playerVars:{controls:0,playsinline:1,rel:0,modestbranding:1},
   events:{
    onStateChange:function(e){
     if(e.data===YT.PlayerState.PLAYING){document.getElementById('playBtn').textContent='Ⅱ';startYTTimer();}
     else if(e.data===YT.PlayerState.PAUSED){document.getElementById('playBtn').textContent='▶';stopYTTimer();}
     else if(e.data===YT.PlayerState.ENDED){document.getElementById('playBtn').textContent='▶';stopYTTimer();nextSong();}
    },
    onError:function(e){
     console.error('YouTube error',e.data);
     const msg='YouTube song could not be played. This video may be unavailable, private, age-restricted, or embedding may be disabled.';
     if(tg)tg.showAlert(msg);else alert(msg);
    }
   }
  });
 }catch(err){console.error('YouTube player init failed',err);}
}
window.onYouTubeIframeAPIReady=initYouTubePlayer;

(function loadYouTubeAPI(){
 if(window.YT && YT.Player){ initYouTubePlayer(); return; }
 const sc=document.createElement('script');
 sc.src='https://www.youtube.com/iframe_api';
 sc.async=true;
 document.head.appendChild(sc);
})();

function youtubeId(url){
 const u=String(url||'').trim(); if(!u)return '';
 try{
  const x=new URL(u);
  if(x.hostname==='youtu.be') return x.pathname.replace(/^\//,'').split('/')[0];
  if(x.hostname.includes('youtube.com')){
   const v=x.searchParams.get('v'); if(v)return v;
   const m=x.pathname.match(/\/(?:embed|shorts|live)\/([^/?]+)/i); if(m)return m[1];
  }
 }catch(e){}
 const m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/))([^&?\/]+)/i);
 return m?m[1]:'';
}
function isYouTubeUrl(url){return !!youtubeId(url);}
function isDirectAudio(url){return /\.(mp3|m4a|aac|wav|ogg|oga|flac)(?:[?#].*)?$/i.test(String(url||''));}
function stopYTTimer(){if(ytTimer){clearInterval(ytTimer);ytTimer=null;}}
function startYTTimer(){
 stopYTTimer();
 ytTimer=setInterval(()=>{
  if(!ytPlayer||typeof ytPlayer.getCurrentTime!=='function')return;
  const cur=Number(ytPlayer.getCurrentTime()||0),dur=Number(ytPlayer.getDuration()||0);
  document.getElementById('progress').value=dur>0?(cur/dur)*100:0;
  document.getElementById('timeDisplay').textContent=`${formatTime(cur)} / ${formatTime(dur)}`;
 },250);
}
function loadYouTubeSong(url){
 const id=youtubeId(url); if(!id)return;
 if(!ytPlayer||typeof ytPlayer.loadVideoById!=='function'){setTimeout(()=>loadYouTubeSong(url),300);return;}
 ytPlayer.cueVideoById(id);
}
function updateTimeDisplay(){
 const display=document.getElementById('timeDisplay'); if(!display)return;
 if(currentSong && isYouTubeUrl(currentSong.youtube||currentSong.audio)){
  const cur=ytPlayer&&typeof ytPlayer.getCurrentTime==='function'?Number(ytPlayer.getCurrentTime()||0):0;
  const dur=ytPlayer&&typeof ytPlayer.getDuration==='function'?Number(ytPlayer.getDuration()||0):0;
  display.textContent=`${formatTime(cur)} / ${formatTime(dur)}`;
 }else{
  const audio=document.getElementById('audio');
  display.textContent=`${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
 }
}
function openPlayer(id){
 const s=songs.find(x=>String(x.id)===String(id)); if(!s)return;
 currentSong=s; hideAll(); document.getElementById('playerPage').classList.remove('hidden');
 document.getElementById('playerCover').src=s.img;
 document.getElementById('playerTitle').textContent=s.name;
 document.getElementById('playerSinger').textContent=s.singer+' • '+s.year;
 document.getElementById('progress').value=0;
 document.getElementById('timeDisplay').textContent='0:00 / 0:00';
 document.getElementById('playBtn').textContent='▶';
 const audio=document.getElementById('audio'); audio.pause(); audio.removeAttribute('src'); audio.load(); stopYTTimer();
 const source=s.youtube||s.audio||'';
 if(isYouTubeUrl(source)){ initYouTubePlayer(); loadYouTubeSong(source); }
 else if(s.audio){audio.src=s.audio;audio.load();}
}
function toggleAudio(){
 if(!currentSong)return;
 const source=currentSong.youtube||currentSong.audio||'';
 if(isYouTubeUrl(source)){
  if(!ytPlayer||typeof ytPlayer.getPlayerState!=='function'){
   const msg='YouTube player is still loading. Please tap Play again in a moment.';
   if(tg)tg.showAlert(msg);else alert(msg); return;
  }
  const state=ytPlayer.getPlayerState();
  if(state===YT.PlayerState.PLAYING) ytPlayer.pauseVideo();
  else {
    const id=youtubeId(source);
    if(id && state===YT.PlayerState.UNSTARTED) ytPlayer.loadVideoById(id);
    else ytPlayer.playVideo();
  }
  return;
 }
 const audio=document.getElementById('audio');
 if(!source){const msg='No audio URL. Add a direct public audio URL or a YouTube URL.';if(tg)tg.showAlert(msg);else alert(msg);return;}
 if(audio.paused){const p=audio.play();if(p&&p.catch)p.catch(err=>{console.error(err);const msg='Audio could not be played. Check the audio URL and hosting permissions.';if(tg)tg.showAlert(msg);else alert(msg);});}else audio.pause();
}

function prevSong(){
 if(!currentSong||!songs.length)return;
 const i=songs.findIndex(s=>String(s.id)===String(currentSong.id));
 openPlayer(songs[(i-1+songs.length)%songs.length].id);
}
function nextSong(){
 if(!currentSong||!songs.length)return;
 const i=songs.findIndex(s=>String(s.id)===String(currentSong.id));
 openPlayer(songs[(i+1)%songs.length].id);
}
function goBackFromPlayer(){goHome();}
function toggleFavorite(id){
 id=String(id);
 let a=favs().map(String);
 a=a.includes(id)?a.filter(x=>x!==id):[...a,id];
 saveFavs(a);
 if(!document.getElementById("favoritesPage").classList.contains("hidden"))showFavorites();else renderHome();
}
function shareSong(){
 if(!currentSong)return;
 const text=currentSong.name+" - "+currentSong.singer;
 if(navigator.share)navigator.share({title:currentSong.name,text});
 else if(tg?.switchInlineQuery)tg.switchInlineQuery(text);
 else navigator.clipboard?.writeText(text);
}
function searchSinger(name){
 document.getElementById("searchInput").value=name;openSearch();
}
function searchAll(){
 const q=document.getElementById("searchInput").value.toLowerCase().trim();
 const results=q?songs.filter(s=>(s.name+" "+s.singer+" "+s.year).toLowerCase().includes(q)):songs;
 document.getElementById("results").innerHTML=results.length?results.map(songHTML).join(""):`<div class="empty">No results found.</div>`;
}
const audio=document.getElementById("audio");

audio.addEventListener("loadedmetadata",()=>{
 updateTimeDisplay();
});

audio.addEventListener("durationchange",()=>{
 updateTimeDisplay();
});

audio.addEventListener("timeupdate",()=>{
 if(Number.isFinite(audio.duration) && audio.duration>0){
   document.getElementById("progress").value=(audio.currentTime/audio.duration)*100;
 }
 updateTimeDisplay();
});

audio.addEventListener("play",()=>{
 document.getElementById("playBtn").textContent="Ⅱ";
});

audio.addEventListener("pause",()=>{
 document.getElementById("playBtn").textContent="▶";
});

audio.addEventListener("error",()=>{
 console.error("Audio error:", audio.error);
});

document.getElementById("progress").addEventListener("input",e=>{
 if(currentSong && isYouTubeUrl(currentSong.youtube||currentSong.audio) && ytPlayer && typeof ytPlayer.getDuration==='function'){
   const dur=Number(ytPlayer.getDuration()||0);
   if(dur>0) ytPlayer.seekTo((Number(e.target.value)/100)*dur,true);
 }else if(Number.isFinite(audio.duration) && audio.duration>0){
   audio.currentTime=(e.target.value/100)*audio.duration;
 }
 updateTimeDisplay();
});

audio.addEventListener("ended",nextSong);

// Remove accidental literal "\n" text nodes without touching JavaScript source.
(function removeLiteralNewlines(){
 const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);
 const nodes=[];
 let node;
 while(node=walker.nextNode()){
   const parent=node.parentElement;
   if(parent && !["SCRIPT","STYLE"].includes(parent.tagName) && node.nodeValue.includes("\\n")){
     nodes.push(node);
   }
 }
 nodes.forEach(n=>n.nodeValue=n.nodeValue.replace(/\\n/g,""));
})();

loadFirebaseData();
</script>
