<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>A2Z Malayalam Songs</title>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyA9rRMUOfcksZjZj04RQLkKrXsKzXKHmRI",
  authDomain: "malayalamsongs-5916d.firebaseapp.com",
  projectId: "malayalamsongs-5916d",
  storageBucket: "malayalamsongs-5916d.firebasestorage.app",
  messagingSenderId: "44232575519",
  appId: "1:44232575519:web:ceaf71571d2d693a7d232a",
  measurementId: "G-LHZR62BRNH"

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
</script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f6f7f9;color:#151515;padding-bottom:82px}
button{font-family:inherit;cursor:pointer}
.header{background:#fff;padding:16px;position:sticky;top:0;z-index:10;border-bottom:1px solid #eee}
.top{display:flex;align-items:center;justify-content:space-between}
.logo{font-size:21px;font-weight:700}
.profile-btn{border:0;width:42px;height:42px;border-radius:50%;background:#eef1f5;font-size:20px}
.search{margin-top:13px;background:#f1f3f5;border-radius:14px;padding:12px 15px;display:flex;gap:9px;align-items:center}
.search input{border:0;outline:0;background:transparent;width:100%;font-size:16px}
.page{padding:20px 15px}
.hidden{display:none!important}
.title{font-size:19px;font-weight:700;margin-bottom:13px}
.row{display:flex;gap:13px;overflow-x:auto;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.album{min-width:145px;border:0;background:#fff;border-radius:14px;overflow:hidden;text-align:left;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.album img{width:145px;height:145px;object-fit:cover;display:block}
.album-info{padding:10px}
.album-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.muted{color:#777;font-size:12px;margin-top:4px}
.song{display:flex;align-items:center;background:#fff;border-radius:13px;padding:9px;margin-bottom:9px}
.song img{width:56px;height:56px;border-radius:9px;object-fit:cover}
.song-info{flex:1;min-width:0;padding:0 11px}
.song-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.play{width:40px;height:40px;border:0;border-radius:50%;background:#168cff;color:#fff;font-size:17px}
.heart{border:0;background:transparent;font-size:24px;margin-right:8px}
.singer{min-width:100px;border:0;background:transparent;text-align:center}
.singer img{width:88px;height:88px;border-radius:50%;object-fit:cover}
.singer div{font-size:13px;font-weight:600;margin-top:7px}
.back{border:0;background:transparent;font-size:16px;padding:0 0 16px}
.detail-cover{width:100%;max-width:420px;aspect-ratio:1/1;object-fit:cover;border-radius:18px;display:block;margin:0 auto 18px}
.detail-title{text-align:center;font-size:23px;font-weight:700}
.detail-sub{text-align:center;color:#777;margin:7px 0 16px}
.primary{display:block;width:100%;max-width:420px;margin:0 auto 18px;border:0;border-radius:12px;padding:13px;background:#168cff;color:#fff;font-size:16px;font-weight:700}
.player{text-align:center}
.player img{width:78%;max-width:350px;aspect-ratio:1/1;object-fit:cover;border-radius:18px}
.player h2{margin-top:16px}
.controls{display:flex;justify-content:center;gap:22px;align-items:center;margin:20px 0}
.ctrl{border:0;background:#eef1f5;width:48px;height:48px;border-radius:50%;font-size:20px}
.bigplay{width:64px;height:64px;background:#168cff;color:#fff;border:0;border-radius:50%;font-size:25px}
.bottom{position:fixed;left:0;right:0;bottom:0;height:66px;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;align-items:center;z-index:20}
.nav{border:0;background:none;color:#777;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px}
.nav span{font-size:21px}.nav.active{color:#168cff}
.empty{text-align:center;color:#777;padding:45px 10px}
@media(min-width:700px){
 .page{padding:25px 30px;max-width:1100px;margin:auto}
 .album{min-width:190px}.album img{width:190px;height:190px}
 .songs{display:grid;grid-template-columns:1fr 1fr;gap:10px}.song{margin:0}
 .detail-cover{max-width:500px}
}

 #youtubePlayerWrap{position:fixed;width:1px;height:1px;left:-10px;top:-10px;overflow:hidden;opacity:.01;pointer-events:none;z-index:-1}
 #youtubePlayer{width:1px;height:1px}
</style>
</head>
<body>

<header class="header">
  <div class="top">
    <div class="logo">🎵 A2Z Malayalam Songs</div>
    <button class="profile-btn" onclick="showProfile()">👤</button>
  </div>
  <div class="search">
    🔍 <input id="searchInput" placeholder="Search songs, albums, singers..." oninput="searchAll()">
  </div>
</header>

<main id="home" class="page">
  <div class="title">🔥 Latest Albums</div>
  <div id="albums" class="row"></div>

  <div class="title" style="margin-top:24px">🎵 Latest Songs</div>
  <div id="songs" class="songs"></div>

  <div class="title" style="margin-top:24px">🎤 Popular Singers</div>
  <div id="singers" class="row"></div>
</main>

<main id="searchPage" class="page hidden">
  <div class="title">🔍 Search Results</div>
  <div id="results"></div>
</main>

<main id="favoritesPage" class="page hidden">
  <div class="title">❤️ My Favorites</div>
  <div id="favorites"></div>
</main>

<main id="profilePage" class="page hidden">
  <div class="title">👤 Profile</div>
  <div style="background:#fff;border-radius:16px;padding:25px;text-align:center">
    <div style="font-size:55px">👤</div>
    <h2 id="userName">Telegram User</h2>
    <p id="userUsername" class="muted" style="font-size:14px"></p>
  </div>
</main>

<main id="albumPage" class="page hidden">
  <button class="back" onclick="goHome()">← Back</button>
  <img id="albumCover" class="detail-cover">
  <div id="albumTitle" class="detail-title"></div>
  <div id="albumMeta" class="detail-sub"></div>
  <button class="primary" onclick="playAlbum()">▶ Play All</button>
  <div id="albumSongs"></div>
</main>

<main id="playerPage" class="page hidden">
  <button class="back" onclick="goBackFromPlayer()">← Back</button>
  <div class="player">
    <img id="playerCover">
    <h2 id="playerTitle"></h2>
    <div id="playerSinger" class="detail-sub"></div>
    <input id="progress" type="range" min="0" max="100" value="0" style="width:90%">
    <div class="controls">
      <button class="ctrl" onclick="prevSong()">⏮</button>
      <button class="bigplay" id="playBtn" onclick="toggleAudio()">▶</button>
      <button class="ctrl" onclick="nextSong()">⏭</button>
    </div>
    <div style="display:flex;justify-content:center;gap:25px">
      <button class="ctrl" id="favoriteBtn" onclick="toggleFavorite(currentSong.id)">♡</button>
      <button class="ctrl" onclick="shareSong()">↗</button>
    </div>
    <div id="youtubePlayerWrap"><div id="youtubePlayer"></div></div>\n     <audio id="audio" preload="metadata"></audio>
  </div>
</main>

<nav class="bottom">
  <button class="nav active" onclick="goHome()"><span>🏠</span>Home</button>
  <button class="nav" onclick="openSearch()"><span>🔍</span>Search</button>
  <button class="nav" onclick="showFavorites()"><span>❤️</span>Favorites</button>
  <button class="nav" onclick="showProfile()"><span>👤</span>Profile</button>
</nav>

<script>
const tg = window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();}

let albums = [];
let singers = [];
let songs = [];

async function loadFirebaseData(){
  try{
    const albumSnap = await db.collection("albums").get();

    albums = albumSnap.docs.map(doc => {
      const d = doc.data();
      return {
        id: doc.id,
        name: d.name || "",
        year: String(d.year || ""),
        count: Number(d.songCount ?? d.count ?? 0),
        img: d.image || d.img || ""
      };
    });

    const songPromises = albumSnap.docs.map(async albumDoc => {
      const snap = await db.collection("albums").doc(albumDoc.id).collection("songs").get();
      return snap.docs.map(doc => {
        const d = doc.data();
        return {
          id: doc.id,
          name: d.name || "",
          singer: d.singer || "",
          year: String(d.released ?? d.year ?? ""),
          album: albumDoc.id,
          img: d.image || d.img || "",
          audio: d.audioUrl || d.audio || "",
          youtube: d.youtubeUrl || d.youtubeURL || d.youtube || d.youtubeLink || d.videoUrl || d.videoURL || d.video || "",
          duration: d.duration || "",
          lyrics: d.lyrics || "",
          music: d.music || ""
        };
      });
    });

    const nestedSongs = await Promise.all(songPromises);
    songs = nestedSongs.flat();

    const singerMap = new Map();
    songs.forEach(s => {
      if(s.singer && !singerMap.has(s.singer)){
        singerMap.set(s.singer, {
          name: s.singer,
          img: s.img || "https://picsum.photos/200/200?random=21"
        });
      }
    });
    singers = [...singerMap.values()];

    renderHome();
  }catch(err){
    console.error("Firebase load error:", err);
    document.getElementById("albums").innerHTML = `<div class="empty">Firebase data load failed.<br><small>${String(err.message || err)}</small></div>`;
    document.getElementById("songs").innerHTML = "";
    document.getElementById("singers").innerHTML = "";
  }
}

let currentSong=null;
let albumSongIndex=0;

const favs=()=>JSON.parse(localStorage.getItem("a2zFavorites")||"[]");
function saveFavs(a){localStorage.setItem("a2zFavorites",JSON.stringify(a));}

function renderHome(){
 document.getElementById("albums").innerHTML=albums.map(a=>`
 <button class="album" onclick="openAlbum(\'${a.id.replaceAll("\'","\\\'")}\')">
 <img src="${a.img}"><div class="album-info"><div class="album-name">${a.name}</div>
 <div class="muted">${a.year} • ${a.count} Songs</div></div></button>`).join("");

 document.getElementById("songs").innerHTML=songs.map(songHTML).join("");

 document.getElementById("singers").innerHTML=singers.map(s=>`
 <button class="singer" onclick="searchSinger('${s.name.replaceAll("'","\\'")}')">
 <img src="${s.img}"><div>${s.name}</div></button>`).join("");
}

function songHTML(s){
 const songId=JSON.stringify(String(s.id)).replace(/</g,"\\u003c");
 return `<div class="song" onclick='openPlayer(${songId})'>
 <img src="${s.img}">
 <div class="song-info">
 <div class="song-name">${s.name}</div><div class="muted">${s.singer} • ${s.year}</div>
 </div>
 <button class="play" onclick='event.stopPropagation();openPlayer(${songId})'>▶</button></div>`;
}

function hideAll(){
 ["home","searchPage","favoritesPage","profilePage","albumPage","playerPage"].forEach(id=>document.getElementById(id).classList.add("hidden"));
}
function goHome(){hideAll();document.getElementById("home").classList.remove("hidden");window.scrollTo(0,0);}
function openSearch(){hideAll();document.getElementById("searchPage").classList.remove("hidden");document.getElementById("searchInput").focus();searchAll();}
function showFavorites(){
 hideAll();document.getElementById("favoritesPage").classList.remove("hidden");
 const fs=songs.filter(s=>favs().includes(s.id));
 document.getElementById("favorites").innerHTML=fs.length?fs.map(songHTML).join(""):`<div class="empty">❤️ No favorite songs yet.</div>`;
}
function showProfile(){
 hideAll();document.getElementById("profilePage").classList.remove("hidden");
 const u=tg?.initDataUnsafe?.user;
 document.getElementById("userName").textContent=u?((u.first_name||"")+" "+(u.last_name||"")).trim():"Telegram User";
 document.getElementById("userUsername").textContent=u?.username?"@"+u.username:"";
}
function openAlbum(id){
 const a=albums.find(x=>x.id===id); if(!a)return;
 hideAll();document.getElementById("albumPage").classList.remove("hidden");
 document.getElementById("albumCover").src=a.img;
 document.getElementById("albumTitle").textContent=a.name;
 document.getElementById("albumMeta").textContent=a.year+" • "+a.count+" Songs";
 const list=songs.filter(s=>String(s.album)===String(id));
 document.getElementById("albumSongs").innerHTML=list.length?list.map(songHTML).join(""):`<div class="empty">No songs added yet.</div>`;
 window.scrollTo(0,0);
}
function playAlbum(){
 const list=songs.filter(s=>String(s.album)===String(albums.find(a=>document.getElementById("albumTitle").textContent===a.name)?.id));
 if(list.length)openPlayer(list[0].id);
}
let ytPlayer=null;
let ytApiReady=false;
let pendingYoutubeId=null;
let ytTimer=null;
let ytPlayWhenReady=false;

function getYoutubeId(url){
  if(!url)return "";
  url=String(url).trim();
  const m=url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/))([A-Za-z0-9_-]{11})/);
  if(m)return m[1];
  const q=url.match(/[?&]v=([A-Za-z0-9_-]{11})/);
  return q?q[1]:"";
}

window.onYouTubeIframeAPIReady=function(){
  ytApiReady=true;
  if(pendingYoutubeId) initYoutubePlayer(pendingYoutubeId);
};

function initYoutubePlayer(videoId, playWhenReady=false){
  pendingYoutubeId=videoId;
  if(playWhenReady) ytPlayWhenReady=true;
  if(!ytApiReady)return;
  if(ytPlayer && typeof ytPlayer.loadVideoById==="function"){
    ytPlayer.loadVideoById(videoId);
    return;
  }
  ytPlayer=new YT.Player("youtubePlayer",{
    width:"1",
    height:"1",
    videoId:videoId,
    playerVars:{playsinline:1,controls:0,rel:0,modestbranding:1},
    events:{
      onReady:function(){
        if(ytPlayWhenReady){
          ytPlayWhenReady=false;
          setTimeout(function(){ if(ytPlayer && typeof ytPlayer.playVideo==="function") ytPlayer.playVideo(); }, 100);
        }
      },
      onStateChange:function(e){
        const btn=document.getElementById("playBtn");
        if(e.data===YT.PlayerState.PLAYING){
          if(btn)btn.textContent="Ⅱ";
          startYoutubeProgress();
        }else if(e.data===YT.PlayerState.PAUSED){
          if(btn)btn.textContent="▶";
          stopYoutubeProgress();
        }else if(e.data===YT.PlayerState.ENDED){
          if(btn)btn.textContent="▶";
          stopYoutubeProgress();
          nextSong();
        }
      },
      onError:function(e){
        const btn=document.getElementById("playBtn");
        if(btn)btn.textContent="▶";
        if(tg)tg.showAlert("YouTube audio could not be played. Please check that the YouTube video is available for embedding.");
        else alert("YouTube audio could not be played. Please check that the YouTube video is available for embedding.");
      }
    }
  });
}

function startYoutubeProgress(){
  stopYoutubeProgress();
  ytTimer=setInterval(function(){
    if(!ytPlayer || !currentSong || typeof ytPlayer.getDuration!=="function")return;
    const d=ytPlayer.getDuration(), c=ytPlayer.getCurrentTime();
    if(d)document.getElementById("progress").value=(c/d)*100;
  },500);
}
function stopYoutubeProgress(){
  if(ytTimer){clearInterval(ytTimer);ytTimer=null;}
}

function openPlayer(id){
  const s=songs.find(x=>x.id===id);if(!s)return;
  currentSong=s;hideAll();document.getElementById("playerPage").classList.remove("hidden");
  document.getElementById("playerCover").src=s.img;
  document.getElementById("playerTitle").textContent=s.name;
  document.getElementById("playerSinger").textContent=s.singer+" • "+s.year;

  const audio=document.getElementById("audio");
  audio.pause();audio.src="";
  stopYoutubeProgress();

  const ytId=getYoutubeId(s.youtube);
  if(ytId){
    pendingYoutubeId=ytId;
    if(ytPlayer && typeof ytPlayer.loadVideoById==="function"){
      ytPlayer.loadVideoById(ytId);
      ytPlayer.pauseVideo();
    }else{
      initYoutubePlayer(ytId);
    }
  }else if(s.audio){
    audio.src=s.audio;
  }

  document.getElementById("playBtn").textContent="▶";
  document.getElementById("progress").value=0;
  const favoriteBtn=document.getElementById("favoriteBtn");
  if(favoriteBtn)favoriteBtn.textContent=favs().map(String).includes(String(s.id))?"❤️":"♡";
}

function toggleAudio(){
  if(!currentSong)return;
  const ytId=getYoutubeId(currentSong.youtube);
  const audio=document.getElementById("audio");

  if(ytId){
    if(!ytPlayer || typeof ytPlayer.getPlayerState!=="function"){
      pendingYoutubeId=ytId;
      initYoutubePlayer(ytId,true);
      return;
    }
    const state=ytPlayer.getPlayerState();
    if(state===YT.PlayerState.PLAYING){
      ytPlayer.pauseVideo();
      document.getElementById("playBtn").textContent="▶";
    }else{
      ytPlayer.playVideo();
      document.getElementById("playBtn").textContent="Ⅱ";
    }
    return;
  }

  if(!currentSong.audio){
    if(tg)tg.showAlert("This song has no audio URL or YouTube URL.");
    else alert("This song has no audio URL or YouTube URL.");
    return;
  }
  if(audio.paused){
    audio.play().then(()=>document.getElementById("playBtn").textContent="Ⅱ")
      .catch(()=>{if(tg)tg.showAlert("Audio could not be played. Please check the audio URL.");});
  }else{
    audio.pause();document.getElementById("playBtn").textContent="▶";
  }
}

function prevSong(){
 if(!currentSong)return;let i=songs.findIndex(s=>s.id===currentSong.id);openPlayer(songs[(i-1+songs.length)%songs.length].id);
}
function nextSong(){
 if(!currentSong)return;let i=songs.findIndex(s=>s.id===currentSong.id);openPlayer(songs[(i+1)%songs.length].id);
}
function goBackFromPlayer(){goHome();}
function toggleFavorite(id){
 id=String(id);
 let a=favs().map(String);
 a=a.includes(id)?a.filter(x=>x!==id):[...a,id];
 saveFavs(a);

 const btn=document.getElementById("favoriteBtn");
 if(btn && currentSong && String(currentSong.id)===id){
   btn.textContent=a.includes(id)?"❤️":"♡";
 }

 if(!document.getElementById("favoritesPage").classList.contains("hidden"))showFavorites();
}
function shareSong(){
 if(!currentSong)return;
 const text=currentSong.name+" - "+currentSong.singer;
 if(navigator.share)navigator.share({title:currentSong.name,text});
 else if(tg?.switchInlineQuery)tg.switchInlineQuery(text);
 else navigator.clipboard?.writeText(text);
}
function searchSinger(name){
 document.getElementById("searchInput").value=name;openSearch();
}
function searchAll(){
 const q=document.getElementById("searchInput").value.toLowerCase().trim();
 const results=q?songs.filter(s=>(s.name+" "+s.singer+" "+s.year).toLowerCase().includes(q)):songs;
 document.getElementById("results").innerHTML=results.length?results.map(songHTML).join(""):`<div class="empty">No results found.</div>`;
}
const audio=document.getElementById("audio");
audio.addEventListener("timeupdate",()=>{if(audio.duration)document.getElementById("progress").value=(audio.currentTime/audio.duration)*100});
document.getElementById("progress").addEventListener("input",e=>{if(audio.duration)audio.currentTime=(e.target.value/100)*audio.duration});
audio.addEventListener("ended",nextSong);

loadFirebaseData();
</script>
</body>
</html>
